name: E2E Mutation Environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mutation:
    name: Disposable environment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Prepare E2E environment variables
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          test -n "$E2E_TEST_PASSWORD"
          echo "E2E_TEST_PASSWORD=$E2E_TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_DB_NAME=ims_e2e" >> "$GITHUB_ENV"
          echo "E2E_DB_USER=ims_e2e" >> "$GITHUB_ENV"
          echo "E2E_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "E2E_DB_ROOT_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "E2E_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_RESEND_API_KEY=e2e-disabled" >> "$GITHUB_ENV"
          echo "E2E_RESEND_FROM_EMAIL=no-reply@e2e.invalid" >> "$GITHUB_ENV"

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate compose configuration
        run: docker compose -f compose.e2e.yml config

      - name: Start disposable E2E stack
        run: docker compose -f compose.e2e.yml up -d --build

      - name: Wait for E2E API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/e2e-health.json; then
              cat /tmp/e2e-health.json
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.e2e.yml logs --no-color api
          exit 1

      - name: Run mutation environment smoke
        working-directory: client
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_SECOND_ADMIN_EID: E2E-SECOND-ADMIN
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm run e2e:mutation

      - name: Publish E2E summary
        if: always()
        run: node .github/scripts/summarize-e2e.mjs client/test-results/mutation-results.json "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mutation-playwright-report
          path: client/playwright-mutation-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mutation-test-results
          path: client/test-results
          if-no-files-found: ignore

      - name: Dump E2E service logs on failure
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v
