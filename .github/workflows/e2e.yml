name: Production E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: production-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-e2e:
    name: Production Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production E2E
        env:
          E2E_BASE_URL: https://ims-project-pi.vercel.app
          E2E_EID: ${{ secrets.E2E_EID }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm run e2e

      - name: Publish GitHub Actions summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const resultPath = 'test-results/results.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!summaryPath) process.exit(0);

          if (!fs.existsSync(resultPath)) {
            fs.appendFileSync(
              summaryPath,
              '## Production E2E\\n\\nPlaywright result JSON was not generated.\\n',
            );
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const stats = report.stats ?? {};
          const durationSeconds =
            typeof stats.duration === 'number'
              ? (stats.duration / 1000).toFixed(1)
              : 'n/a';

          const lines = [
            '## Production E2E',
            '',
            '| Item | Result |',
            '| --- | ---: |',
            '| Expected / passed | ' + (stats.expected ?? 0) + ' |',
            '| Unexpected / failed | ' + (stats.unexpected ?? 0) + ' |',
            '| Skipped | ' + (stats.skipped ?? 0) + ' |',
            '| Flaky | ' + (stats.flaky ?? 0) + ' |',
            '| Duration | ' + durationSeconds + 's |',
            '',
            '### Scope',
            '- Test identity: public DEMO account',
            '- Unauthenticated redirects: covered',
            '- EMPLOYEE runtime matrix: not configured',
            '- Business mutations: not run against production',
            '- Database verification: not run',
          ];

          fs.appendFileSync(summaryPath, lines.join('\\n') + '\\n');
          NODE

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results
          if-no-files-found: ignore
