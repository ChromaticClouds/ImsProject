name: Keep Aiven database active

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-aiven-database-active
  cancel-in-progress: true

jobs:
  database-health-check:
    name: Query database through the API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://imsproject-vanl.onrender.com/api/health/database' }}
    steps:
      - name: Call database health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            "$KEEP_ALIVE_URL"
