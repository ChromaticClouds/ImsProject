name: Keep Supabase project active

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-project-active
  cancel-in-progress: true

jobs:
  storage-health-check:
    name: Query Supabase Storage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: ims-product-images
    steps:
      - name: List product images bucket
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            -X POST \
            "${SUPABASE_URL%/}/storage/v1/object/list/${SUPABASE_BUCKET}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"limit":1,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}'
