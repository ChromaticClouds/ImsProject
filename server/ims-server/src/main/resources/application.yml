spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASS}

server:
  port: ${PORT:8080}

app:
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

  client:
    base-url: ${CLIENT_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${UPLOAD_DIR:./uploads}
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      product-image-bucket: ${SUPABASE_PRODUCT_IMAGE_BUCKET:ims-product-images}
      notice-attachment-bucket: ${SUPABASE_NOTICE_ATTACHMENT_BUCKET:ims-notice-attachments}
      signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL_SECONDS:600}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

jwt:
  secret: ${JWT_SECRET}
  access-exp-minutes: 60
  refresh-exp-days: 14

kind: Application
